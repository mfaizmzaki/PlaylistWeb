<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- NO CSP, NO AUDIO -->
    <title>Podi@UM - Projector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        #slide-display {
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }
        #slide-display img[src=""] { display: none; }
        #slide-display img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border: none;
            border-radius: 0;
        }
    </style>
</head>
<body>
    <div id="slide-display">
        <img id="public-slide" src="" alt="Current slide" />
        <canvas id="medal-canvas" width="1920" height="1080" style="display:none;width:100%;height:100%;object-fit:contain;background:#fff"></canvas>
    </div>

    <script src="medal.js"></script>
    <script>
        // ============================================================
        // 1. BROADCAST CHANNEL – only for slide updates
        // ============================================================
        const channel = new BroadcastChannel('presenter_hdmi');
        const slideImg = document.getElementById('public-slide');

        // ============================================================
        // 2. LISTEN FOR SLIDE NAVIGATION COMMANDS
        // ============================================================
        channel.onmessage = (event) => {
            const data = event.data;
            if (!data) return;
            if (data.action === 'navigateSlide') {
                stopMedalSlide();
                slideImg.src = data.dataURL;
                document.title = `📺 Slide ${data.index + 1}`;
            } else if (data.action === 'medalSlide') {
                showMedalSlide(data.logos, data.tie, data.sport);
            } else if (data.action === 'backdrop') {
                showBackdrop();
            }
        };

        // ============================================================
        // 3. ANIMATED MEDAL SLIDE (flags waving) + BACKDROP
        // ============================================================
        const backdropImg = new Image(); backdropImg.src = 'Sukipt7 Main Backdrop.png';
        const BACKDROP_LOGO_BOX = [123, 197, 849, 366];   // where the (blurry) logo sits on the 960x540 backdrop
        async function showBackdrop() {   // idle screen before/after each ceremony, with the hi-res logo
            if (!backdropImg.complete) await new Promise(r => backdropImg.onload = r);
            if (!Medal.logo.complete) await new Promise(r => Medal.logo.onload = r);
            stopMedalSlide();
            const ctx = medalCanvas.getContext('2d');
            ctx.drawImage(backdropImg, 0, 0, 1920, 1080);
            const [x0, y0, x1, y1] = BACKDROP_LOGO_BOX.map(v => v * 2);
            ctx.fillStyle = '#fff'; ctx.fillRect(x0 - 8, y0 - 8, x1 - x0 + 16, y1 - y0 + 16);
            Medal.drawContained(ctx, Medal.logo, x0, y0, x1, y1, 0);
            slideImg.style.display = 'none'; medalCanvas.style.display = 'block';
            document.title = '📺 Backdrop';
        }
        showBackdrop();
        const medalCanvas = document.getElementById('medal-canvas');
        const medalTpl = new Image(); medalTpl.src = 'Template Majlis Sukipt.png';
        let medalAnim = null;
        const loadImg = src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
        async function showMedalSlide(logos, tie, sport) {
            if (!medalTpl.complete) await new Promise(r => medalTpl.onload = r);
            if (!Medal.logo.complete) await new Promise(r => Medal.logo.onload = r);
            stopMedalSlide();
            const ctx = medalCanvas.getContext('2d');
            const base = document.createElement('canvas'); base.width = 1920; base.height = 1080;
            const rects = Medal.drawBase(base.getContext('2d'), medalTpl, tie, { eraseCloth: true });
            if (sport) Medal.drawSport(base.getContext('2d'), await loadImg(sport.logo), sport.name);
            const cloths = [];
            let i = 0;
            for (const m in rects) {
                const logo = logos[m] ? await loadImg(logos[m]) : null;
                cloths.push({ rect: rects[m], cloth: Medal.makeCloth(medalTpl, tie, rects[m], logo), phase: i++ * 1.7 });
            }
            slideImg.style.display = 'none'; medalCanvas.style.display = 'block';
            const t0 = performance.now();
            const frame = now => {
                const t = (now - t0) / 1000;
                ctx.drawImage(base, 0, 0);
                for (const c of cloths) Medal.drawWaving(ctx, c.cloth, c.rect, t, c.phase);
                medalAnim = requestAnimationFrame(frame);
            };
            medalAnim = requestAnimationFrame(frame);
            document.title = '📺 Medal slide';
        }
        function stopMedalSlide() {
            if (medalAnim) cancelAnimationFrame(medalAnim); medalAnim = null;
            medalCanvas.style.display = 'none'; slideImg.style.display = '';
        }

        // ============================================================
        // 4. INIT
        // ============================================================
        console.log('📺 Projector ready – waiting for slides.');
    </script>
</body>
</html>
