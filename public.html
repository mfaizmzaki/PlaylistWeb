<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUKIPT 2026 - Projector</title>
    <style>
        /* RESET EVERYTHING – NO BORDERS, NO MARGINS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000000; /* Pure black */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            /* Remove any default user-agent styles */
            margin: 0;
            padding: 0;
        }
        #slide-display {
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* NO border, NO border-radius */
            border: none;
            border-radius: 0;
            box-shadow: none;
        }
        #slide-display img[src=""] { display: none; }
        #slide-display img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Keeps aspect ratio, letterboxes with black */
            display: block;
            /* NO border, NO padding */
            border: none;
            border-radius: 0;
        }

        /* AUDIO UNLOCK OVERLAY – shows until user clicks */
        #audio-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            z-index: 9999;
            cursor: pointer;
            user-select: none;
            transition: opacity 0.8s ease;
        }
        #audio-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #audio-overlay h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        #audio-overlay p {
            font-size: 1.5rem;
            opacity: 0.7;
            letter-spacing: 2px;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Tiny error toast (only shows if file missing) */
        #error-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.85);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 1rem;
            font-family: monospace;
            z-index: 9998;
            display: none;
            text-align: center;
            pointer-events: none;
            white-space: nowrap;
        }
        #error-toast.show {
            display: block;
        }
    </style>
</head>
<body>

    <!-- AUDIO UNLOCK OVERLAY -->
    <div id="audio-overlay">
        <h1>🎤</h1>
        <p>Click anywhere to enable audio</p>
        <p style="font-size:0.9rem; opacity:0.4; margin-top:20px;">(Required for browser autoplay policy)</p>
    </div>

    <!-- SLIDE DISPLAY – PURE FULLSCREEN -->
    <div id="slide-display">
        <img id="public-slide" src="" alt="Current slide" />
        <canvas id="medal-canvas" width="1920" height="1080" style="display:none;width:100%;height:100%;object-fit:contain"></canvas>
    </div>
    <script src="medal.js"></script>

    <!-- ERROR TOAST (shows if a song fails to load) -->
    <div id="error-toast"></div>

    <script>
        // ============================================================
        // 1. SONG LISTS (same as presenter)
        // ============================================================
        const FLAG_SONG = './music/Lagu Universiti/LAGU SUKIPT.mp3';
        const HOUSE_SONGS = [
            './music/Darah Muda.mp3', './music/Ekstravaganza.mp3', './music/Gemuruh.mp3',
            './music/Generasiku.mp3', './music/Hall of Fame.mp3', './music/Jalur Gemilang.mp3',
            './music/Kembali Bersama.mp3', './music/Keranamu.mp3', './music/Lagu Untukmu.mp3',
            './music/Malam Ini Kita Punya.mp3', './music/MALAYSIA.mp3', './music/Merdeka.mp3',
            './music/Negaraku.mp3', './music/Pelita.mp3', './music/Revolusi.mp3',
            './music/Situasi.mp3', './music/Standing In The Eyes Of The World.mp3',
            './music/Teguh Mimpi.mp3', './music/Warisan.mp3'
        ];
        const CONTINGENT_SONGS = [
            './music/Lagu Universiti/ALAM.MP3', './music/Lagu Universiti/City University.mp3',
            './music/Lagu Universiti/IIUM.mp3', './music/Lagu Universiti/Kolej Komuniti .mp3',
            './music/Lagu Universiti/KPTM.wav', './music/Lagu Universiti/MAHSA.mp3',
            './music/Lagu Universiti/MMU.mp3', './music/Lagu Universiti/MSU.mp3',
            './music/Lagu Universiti/Politeknik Malaysia.mp3', './music/Lagu Universiti/TESDEC.mp3',
            './music/Lagu Universiti/UC TATI.mp3', './music/Lagu Universiti/UCAM.mp3',
            './music/Lagu Universiti/UCSI.mp3', './music/Lagu Universiti/UiTM.mp3',
            './music/Lagu Universiti/UKM.mp3', './music/Lagu Universiti/UMK.mp3',
            './music/Lagu Universiti/UMPSA.mp3', './music/Lagu Universiti/UMS.mpeg',
            './music/Lagu Universiti/UMT.mp3', './music/Lagu Universiti/UniKL.mp3',
            './music/Lagu Universiti/UNIKOP.mpeg', './music/Lagu Universiti/UniMAP.mp3',
            './music/Lagu Universiti/UNIMAS.mp3', './music/Lagu Universiti/UNIRAZAK.mp3',
            './music/Lagu Universiti/UNISEL.mp3', './music/Lagu Universiti/UniSZA.mp3',
            './music/Lagu Universiti/UNITAR.mp3', './music/Lagu Universiti/UNITEN.mp3',
            './music/Lagu Universiti/Universiti Malaya.mp3', './music/Lagu Universiti/UPM.mp3',
            './music/Lagu Universiti/UPNM.mp3', './music/Lagu Universiti/UPSI.mp3',
            './music/Lagu Universiti/UPTM.mp3', './music/Lagu Universiti/USIM.mp3',
            './music/Lagu Universiti/USM.mp3', './music/Lagu Universiti/UTeM.mp3',
            './music/Lagu Universiti/UTHM.mp3', './music/Lagu Universiti/UTM.mp3',
            './music/Lagu Universiti/UTP.mp3', './music/Lagu Universiti/UUM.mp3'
        ];

        // ============================================================
        // 2. BROADCAST CHANNEL
        // ============================================================
        const channel = new BroadcastChannel('presenter_hdmi');

        // ============================================================
        // 3. UI REFS
        // ============================================================
        const slideImg = document.getElementById('public-slide');
        const overlay = document.getElementById('audio-overlay');
        const errorToast = document.getElementById('error-toast');
        let toastTimeout = null;

        // ============================================================
        // 4. AUDIO ENGINE STATE
        // ============================================================
        let audioCtx = null;
        let masterGain = null;
        // Opened by double-click (file://)? Web Audio treats the media as cross-origin and outputs SILENCE,
        // so fade with the element's own volume instead. Same call shape as a GainNode so the engine is unchanged.
        const FILE_MODE = location.protocol === 'file:';
        let masterVol = 1;
        function elementGain(el) {
            let v = 0, raf = null;
            const apply = () => { el.volume = Math.max(0, Math.min(1, v * masterVol)); };
            const gain = {
                get value() { return v; }, set value(x) { v = x; apply(); },
                setValueAtTime(x) { cancelAnimationFrame(raf); v = x; apply(); },
                linearRampToValueAtTime(x, endTime) {
                    cancelAnimationFrame(raf);
                    const dur = Math.max(10, (endTime - audioCtx.currentTime) * 1000), v0 = v, t0 = performance.now();
                    const step = () => { const k = Math.min(1, (performance.now() - t0) / dur); v = v0 + (x - v0) * k; apply(); if (k < 1) raf = requestAnimationFrame(step); };
                    raf = requestAnimationFrame(step);
                }
            };
            return { gain };
        }
        let currentSources = [];
        let activeAudioEl = null;
        let activeUrl = null;
        let isAudioUnlocked = false;

        // House state
        let houseState = { index: 0, time: 0, isActive: false, isPlaying: false };

        // ============================================================
        // 5. UNLOCK AUDIO ON USER CLICK
        // ============================================================
        overlay.addEventListener('click', () => {
            unlockAudio();
        });

        function unlockAudio() {
            if (isAudioUnlocked) return;
            // Create and resume AudioContext
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 1.0;
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isAudioUnlocked = true;
            overlay.classList.add('hidden');
            sendStatus('Audio unlocked. Ready.');
            console.log('🔊 Audio unlocked.');
        }

        // ============================================================
        // 6. CORE AUDIO FUNCTIONS
        // ============================================================
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 1.0;
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (!isAudioUnlocked) {
                // If overlay still visible, force unlock
                isAudioUnlocked = true;
                overlay.classList.add('hidden');
            }
        }

        function fadeOutAll(duration = 1.5, callback = null) {
            if (currentSources.length === 0) {
                if (callback) callback();
                return;
            }
            const promises = currentSources.map((item) => {
                return new Promise((resolve) => {
                    const gain = item.gain;
                    const startVal = gain.gain.value;
                    const startTime = audioCtx.currentTime;
                    gain.gain.setValueAtTime(startVal, startTime);
                    gain.gain.linearRampToValueAtTime(0, startTime + duration);
                    setTimeout(() => {
                        if (item.audioEl) {
                            item.audioEl.pause();
                            item.audioEl.currentTime = 0;
                        }
                        try { item.source.disconnect(); } catch (e) {}
                        resolve();
                    }, duration * 1000 + 50);
                });
            });
            Promise.all(promises).then(() => {
                currentSources = [];
                activeAudioEl = null;
                activeUrl = null;
                if (callback) callback();
                sendStatus('All stopped');
                updateProgressBar();
            });
        }

        function internalPlayFresh(url, startTime = 0, fadeInDuration = 1.5, isHouse = false) {
            initAudio();

            const audioEl = new Audio(url);
            audioEl.preload = 'auto';
            audioEl.currentTime = startTime;

            // ERROR HANDLING – if file not found
            audioEl.onerror = (e) => {
                const errMsg = `❌ Failed to load: ${url.split('/').pop()}`;
                console.error(errMsg, e);
                showError(errMsg);
                sendStatus(errMsg);
                // Remove this item from sources if it was added
                const idx = currentSources.findIndex(s => s.audioEl === audioEl);
                if (idx !== -1) {
                    currentSources.splice(idx, 1);
                }
                if (activeAudioEl === audioEl) {
                    activeAudioEl = null;
                    activeUrl = null;
                }
            };

            let source, gainNode;
            if (FILE_MODE) {
                source = { disconnect() {} };
                gainNode = elementGain(audioEl);
                gainNode.gain.setValueAtTime(0);
            } else {
                source = audioCtx.createMediaElementSource(audioEl);
                gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                source.connect(gainNode);
                gainNode.connect(masterGain);
            }

            audioEl.play().catch(e => {
                if (e.name !== 'AbortError') {
                    console.warn('Play error:', e);
                    showError(`Playback error: ${e.message}`);
                }
            });
            gainNode.gain.linearRampToValueAtTime(1, audioCtx.currentTime + fadeInDuration);

            const item = { source, gain: gainNode, audioEl, url, isHouse };
            currentSources.push(item);
            activeAudioEl = audioEl;
            activeUrl = url;

            audioEl.addEventListener('timeupdate', () => {
                if (activeAudioEl === audioEl) updateProgressBar();
            });
            audioEl.addEventListener('loadedmetadata', () => {
                if (activeAudioEl === audioEl) updateProgressBar();
            });
            audioEl.addEventListener('ended', () => {
                if (isHouse && currentSources.length > 0 && currentSources[0]?.audioEl === audioEl) {
                    handleHouseEnded();
                }
            });

            const label = getDisplayName(url);
            sendNowPlaying(label);
            sendStatus(`Playing: ${label}`);
            updateProgressBar();
            sendTrackPlaying(url);
            if (isHouse) {
                houseState.isPlaying = true;
                sendHouseState();
            } else {
                if (url === FLAG_SONG) sendFlagState(true);
            }
            return item;
        }

        function playTrack(url, startTime = 0, isHouse = false) {
            initAudio();

            if (currentSources.length > 0 && houseState.isPlaying) {
                const houseItem = currentSources.find(s => s.isHouse);
                if (houseItem) {
                    houseState.time = houseItem.audioEl.currentTime;
                    houseState.index = HOUSE_SONGS.indexOf(houseItem.url);
                    if (houseState.index === -1) houseState.index = 0;
                }
            }

            if (isHouse) {
                houseState.index = HOUSE_SONGS.indexOf(url);
                if (houseState.index === -1) houseState.index = 0;
                houseState.time = startTime;
                houseState.isActive = true;
                houseState.isPlaying = true;
            } else {
                if (houseState.isPlaying) {
                    const houseItem = currentSources.find(s => s.isHouse);
                    if (houseItem) houseState.time = houseItem.audioEl.currentTime;
                    houseState.isPlaying = false;
                }
            }

            if (currentSources.length > 0) {
                fadeOutAll(1.2, () => {
                    internalPlayFresh(url, startTime, 1.5, isHouse);
                });
            } else {
                internalPlayFresh(url, startTime, 1.5, isHouse);
            }
        }

        function stopTrack(url, duration = 1.2) {
            const idx = currentSources.findIndex(item => item.url === url);
            if (idx === -1) return false;
            const item = currentSources[idx];
            const gain = item.gain;
            const startVal = gain.gain.value;
            const startTime = audioCtx.currentTime;
            gain.gain.setValueAtTime(startVal, startTime);
            gain.gain.linearRampToValueAtTime(0, startTime + duration);
            setTimeout(() => {
                if (item.audioEl) { item.audioEl.pause();
                    item.audioEl.currentTime = 0; }
                try { item.source.disconnect(); } catch (e) {}
            }, duration * 1000 + 50);
            currentSources.splice(idx, 1);
            if (activeAudioEl === item.audioEl) {
                activeAudioEl = null;
                activeUrl = null;
                sendNowPlaying('Nothing playing');
                updateProgressBar();
            }
            sendStatus('Stopped');
            return true;
        }

        function isPlaying(url) {
            return currentSources.some(item => item.url === url);
        }

        function getDisplayName(url) {
            if (url.startsWith('blob:')) return 'Custom Upload';
            let name = url.split('/').pop().replace(/\.[^/.]+$/, '').replace(/%20/g, ' ');
            return name;
        }

        function handleHouseEnded() {
            if (!houseState.isActive) return;
            let nextIndex = houseState.index + 1;
            if (nextIndex >= HOUSE_SONGS.length) nextIndex = 0;
            houseState.index = nextIndex;
            houseState.time = 0;
            const nextUrl = HOUSE_SONGS[nextIndex];
            if (currentSources.length > 0) {
                fadeOutAll(0.8, () => {
                    internalPlayFresh(nextUrl, 0, 1.5, true);
                });
            } else {
                internalPlayFresh(nextUrl, 0, 1.5, true);
            }
        }

        // ============================================================
        // 7. UI HELPERS (Error Toast)
        // ============================================================
        function showError(msg) {
            errorToast.textContent = msg;
            errorToast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                errorToast.classList.remove('show');
            }, 5000);
        }

        // ============================================================
        // 8. SEND STATUS TO PRESENTER
        // ============================================================
        function sendStatus(msg) { channel.postMessage({ type: 'status', msg }); }

        function sendNowPlaying(label) { channel.postMessage({ type: 'nowPlaying', label }); }

        function sendTrackPlaying(url) { channel.postMessage({ type: 'trackPlaying', url: url || null }); }

        function sendFlagState(isPlaying) { channel.postMessage({ type: 'flagState', isPlaying }); }

        function sendHouseState() {
            channel.postMessage({ type: 'houseState', isPlaying: houseState.isPlaying, index: houseState.index,
                time: houseState.time });
        }

        function updateProgressBar() {
            if (activeAudioEl && !isNaN(activeAudioEl.duration) && activeAudioEl.duration > 0) {
                channel.postMessage({ type: 'progress', currentTime: activeAudioEl.currentTime, duration: activeAudioEl
                        .duration });
            } else {
                channel.postMessage({ type: 'progress', currentTime: 0, duration: 0 });
            }
        }

        // ============================================================
        // 9. COMMAND HANDLER
        // ============================================================
        channel.onmessage = (event) => {
            const data = event.data;
            if (!data) return;
            const action = data.action;

            // Auto-unlock if command arrives and not unlocked (safety)
            if (!isAudioUnlocked) unlockAudio();

            switch (action) {
                case 'toggleFlag': {
                    if (isPlaying(FLAG_SONG)) {
                        stopTrack(FLAG_SONG);
                        sendFlagState(false);
                        if (houseState.isActive) { houseState.isPlaying = false;
                            sendHouseState(); }
                    } else {
                        if (houseState.isPlaying) {
                            const houseItem = currentSources.find(s => s.isHouse);
                            if (houseItem) houseState.time = houseItem.audioEl.currentTime;
                            houseState.isPlaying = false;
                        }
                        playTrack(FLAG_SONG, 0, false);
                        sendFlagState(true);
                        sendHouseState();
                    }
                    break;
                }
                case 'playHouse': {
                    const { url, index } = data;
                    houseState.index = index;
                    houseState.time = 0;
                    houseState.isActive = true;
                    houseState.isPlaying = true;
                    playTrack(url, 0, true);
                    sendHouseState();
                    break;
                }
                case 'resumeHouse': {
                    if (houseState.isPlaying && currentSources.some(s => s.isHouse)) break;
                    if (!houseState.isActive) { houseState.index = 0;
                        houseState.time = 0;
                        houseState.isActive = true; }
                    houseState.isPlaying = true;
                    if (isPlaying(FLAG_SONG)) {
                        fadeOutAll(1.2, () => {
                            playTrack(HOUSE_SONGS[houseState.index], houseState.time, true);
                            sendHouseState();
                            sendFlagState(false);
                        });
                    } else if (currentSources.length > 0) {
                        fadeOutAll(1.2, () => {
                            playTrack(HOUSE_SONGS[houseState.index], houseState.time, true);
                            sendHouseState();
                        });
                    } else {
                        playTrack(HOUSE_SONGS[houseState.index], houseState.time, true);
                        sendHouseState();
                    }
                    break;
                }
                case 'stopAll': {
                    const houseItem = currentSources.find(s => s.isHouse);
                    if (houseItem) { houseState.time = houseItem.audioEl.currentTime;
                        houseState.isPlaying = false; }
                    fadeOutAll(1.5, () => {
                        sendNowPlaying('Nothing playing');
                        sendStatus('⏹ All stopped');
                        updateProgressBar();
                        sendFlagState(false);
                        sendHouseState();
                        sendTrackPlaying(null);
                    });
                    break;
                }
                case 'setVolume': {
                    if (FILE_MODE) {
                        masterVol = data.value;
                        currentSources.forEach(s => { s.gain.gain.value = s.gain.gain.value; }); // re-apply
                        channel.postMessage({ type: 'volume', value: data.value });
                    } else if (masterGain) {
                        masterGain.gain.setValueAtTime(data.value, audioCtx.currentTime);
                        channel.postMessage({ type: 'volume', value: data.value });
                    }
                    break;
                }
                case 'seek': {
                    if (activeAudioEl && !isNaN(activeAudioEl.duration) && activeAudioEl.duration > 0) {
                        activeAudioEl.currentTime = data.percent * activeAudioEl.duration;
                        updateProgressBar();
                    }
                    break;
                }
                case 'playCustom':
                case 'playContingent': {
                    const { url } = data;
                    if (houseState.isPlaying) {
                        const houseItem = currentSources.find(s => s.isHouse);
                        if (houseItem) houseState.time = houseItem.audioEl.currentTime;
                        houseState.isPlaying = false;
                        sendHouseState();
                    }
                    playTrack(url, 0, false);
                    sendFlagState(false);
                    sendTrackPlaying(url);
                    break;
                }
                case 'togglePlayPause': {
                    if (activeAudioEl) {
                        if (activeAudioEl.paused) activeAudioEl.play();
                        else activeAudioEl.pause();
                    }
                    break;
                }
                case 'medalSlide': {
                    showMedalSlide(data.logos, data.tie);
                    break;
                }
                case 'navigateSlide': {
                    const { index, dataURL } = data;
                    stopMedalSlide();
                    slideImg.src = dataURL;
                    document.title = `📺 Slide ${index+1}`;
                    break;
                }
                default:
                    console.warn('Unknown command:', action);
            }
        };

        // ============================================================
        // 9b. ANIMATED MEDAL SLIDE (flags waving)
        // ============================================================
        const medalCanvas = document.getElementById('medal-canvas');
        const medalTpl = new Image(); medalTpl.src = 'Template Majlis Sukipt.png';
        let medalAnim = null;
        const loadImg = src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
        async function showMedalSlide(logos, tie) {
            if (!medalTpl.complete) await new Promise(r => medalTpl.onload = r);
            stopMedalSlide();
            const ctx = medalCanvas.getContext('2d');
            const base = document.createElement('canvas'); base.width = 1920; base.height = 1080;
            const rects = Medal.drawBase(base.getContext('2d'), medalTpl, tie, { eraseCloth: true });
            const cloths = [];
            let i = 0;
            for (const m in rects) {
                const logo = logos[m] ? await loadImg(logos[m]) : null;
                cloths.push({ rect: rects[m], cloth: Medal.makeCloth(medalTpl, tie, rects[m], logo), phase: i++ * 1.7 });
            }
            slideImg.style.display = 'none'; medalCanvas.style.display = 'block';
            const t0 = performance.now();
            const frame = now => {
                const t = (now - t0) / 1000;
                ctx.drawImage(base, 0, 0);
                for (const c of cloths) Medal.drawWaving(ctx, c.cloth, c.rect, t, c.phase);
                medalAnim = requestAnimationFrame(frame);
            };
            medalAnim = requestAnimationFrame(frame);
            document.title = '📺 Medal slide';
        }
        function stopMedalSlide() {
            if (medalAnim) cancelAnimationFrame(medalAnim); medalAnim = null;
            medalCanvas.style.display = 'none'; slideImg.style.display = '';
        }

        // ============================================================
        // 10. INIT
        // ============================================================
        sendNowPlaying('Ready');
        sendStatus('Waiting for presenter... Click screen to enable audio.');
        sendFlagState(false);
        sendHouseState();

        setInterval(() => {
            if (activeAudioEl && !activeAudioEl.paused) updateProgressBar();
        }, 500);

        console.log('📺 Projector (Borderless) ready.');
        console.log('Click the overlay to unlock audio.');
    </script>
</body>
</html>
